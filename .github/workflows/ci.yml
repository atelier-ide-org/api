name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # The interface alone (as the IDE uses it), and with each feature of the plugins.
      - run: cargo clippy --all-targets --no-default-features
      - run: cargo clippy --all-targets --no-default-features --features serde
      - run: cargo clippy --all-targets --features glow
      - run: cargo test --features glow
      # The command line of the plugins.
      - run: cargo clippy -p atelier-cli --all-targets --locked
      - run: cargo test -p atelier-cli --locked
