[package]
name = "atelier-cli"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "The command line of the native plugins of Atelier: create, compile and package them"
repository = "https://github.com/atelier-ide-org/api"
publish = false

[[bin]]
name = "atelier-cli"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
